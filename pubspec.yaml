name: connectivity_kit
description: >-
  Lightweight internet connection monitoring for Flutter apps: a pure service
  with a GetX controller, disconnect debouncing, and an optional real
  reachability probe on top of connectivity_plus.
version: 0.2.1
homepage: https://github.com/alheekmahlib/connectivity_kit
repository: https://github.com/alheekmahlib/connectivity_kit
issue_tracker: https://github.com/alheekmahlib/connectivity_kit/issues

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  get: ^4.7.3
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
